name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Placeholder only — the Resend client is constructed at module scope in
      # API routes, so the build needs a value present. Real keys live in Vercel.
      RESEND_API_KEY: re_ci_placeholder_not_a_real_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        # `next-env.d.ts` is gitignored and normally regenerated as a side
        # effect of any `next` CLI command. Under Next 15 that was `next
        # lint`; Next 16 removes it, so it must be created explicitly before
        # a standalone `tsc` run, or static asset imports fail to resolve.
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
