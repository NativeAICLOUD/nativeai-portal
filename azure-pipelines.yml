trigger:
- dev

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  displayName: 'Install npm dependencies and build'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'  # Adjust if needed
    Contents: |
      .next/**
      public/**
      package.json
      package-lock.json
      # Include any other files necessary for your app
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
  displayName: 'Copy files to staging directory'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'nextjs-artifact'
    publishLocation: 'Container'
  displayName: 'Publish Build Artifacts'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'native-portal-connection'  # Replace with your actual service connection name
    appName: 'native=portal'
    package: '$(Pipeline.Workspace)/nextjs-artifact/**/*.zip'
    resourceGroupName: 'rg-nativecloud-web'
  displayName: 'Deploy to Azure App Service'
